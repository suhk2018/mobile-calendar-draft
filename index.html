<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3182f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="캘린더" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>캘린더</title>
    <link rel="manifest" href="manifest.webmanifest?v=19" />
    <link rel="icon" href="icon.svg?v=19" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=19" />
    <link rel="stylesheet" href="styles.css?v=19" />
    <script>
      try {
        const savedTheme = localStorage.getItem('calendar-theme-v1');
        document.documentElement.dataset.theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (localStorage.getItem('calendar-scope-v1') === 'shared') document.documentElement.dataset.restoringCalendar = 'shared';
      } catch {}
    </script>
  </head>
  <body>
    <div class="calendar-restore-screen" role="status" aria-live="polite">
      <span class="calendar-restore-spinner" aria-hidden="true"></span>
      <strong>공유 캘린더 불러오는 중</strong>
    </div>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <button class="menu-button" id="menuButton" type="button" aria-label="캘린더 메뉴 열기">☰</button>
          <div>
            <p class="eyebrow">MY CALENDAR</p>
            <h1 id="currentCalendarTitle" aria-live="polite">나의 일정</h1>
          </div>
        </div>
        <div class="top-actions">
          <button class="text-button" id="todayButton" type="button">오늘</button>
        </div>
      </header>

      <section class="calendar-panel" aria-label="월간 캘린더">
        <div class="month-controls">
          <button class="nav-button" id="previousMonth" type="button" aria-label="이전 달">‹</button>
          <h2 id="monthTitle" aria-live="polite"></h2>
          <button class="nav-button" id="nextMonth" type="button" aria-label="다음 달">›</button>
        </div>

        <div class="calendar-viewport" id="calendarViewport">
          <div class="weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="날짜 선택"></div>
        </div>
      </section>

      <section class="agenda-panel" aria-labelledby="agendaTitle">
        <div class="agenda-heading">
          <div>
            <p class="eyebrow" id="selectedDateLabel">선택한 날짜</p>
            <h2 id="agendaTitle">일정을 선택하세요</h2>
          </div>
          <div class="agenda-actions">
            <span class="event-count" id="eventCount">0개</span>
            <button class="agenda-add-button" id="addEventButton" type="button">일정 추가</button>
          </div>
        </div>
        <div class="event-list" id="eventList" aria-live="polite"></div>
      </section>

      <div class="composer-backdrop" id="composerBackdrop" hidden></div>
      <section class="composer" aria-labelledby="composerTitle" aria-modal="true" role="dialog" tabindex="-1">
        <div class="composer-heading">
          <div>
            <p class="eyebrow" id="composerScopeLabel">MY SCHEDULE</p>
            <h2 id="composerTitle">일정 추가</h2>
          </div>
          <button class="close-composer" id="closeComposer" type="button" aria-label="일정 추가 닫기">×</button>
        </div>
        <form id="eventForm">
          <label>
            일정 이름
            <input id="eventTitle" name="title" type="text" placeholder="예: 팀 미팅" maxlength="42" required />
          </label>
          <div class="form-row date-row">
            <label>
              시작일
              <input id="eventStartDate" name="startDate" type="date" required />
            </label>
            <label>
              종료일
              <input id="eventEndDate" name="endDate" type="date" required />
            </label>
          </div>
          <label class="all-day-toggle">
            <span>종일</span>
            <input id="eventAllDay" name="allDay" type="checkbox" checked />
          </label>
          <label id="eventTimeField">
            시간
            <input id="eventTime" name="time" type="time" value="09:00" />
          </label>
          <p class="form-error" id="formError" role="alert" hidden></p>
          <fieldset>
            <legend>색상</legend>
            <div class="color-options">
              <label class="color-choice"><input type="radio" name="color" value="mint" checked /><span class="color-swatch mint"></span><span class="sr-only">민트</span></label>
              <label class="color-choice"><input type="radio" name="color" value="coral" /><span class="color-swatch coral"></span><span class="sr-only">코랄</span></label>
              <label class="color-choice"><input type="radio" name="color" value="violet" /><span class="color-swatch violet"></span><span class="sr-only">보라</span></label>
              <label class="color-choice"><input type="radio" name="color" value="sun" /><span class="color-swatch sun"></span><span class="sr-only">노랑</span></label>
              <label class="color-choice"><input type="radio" name="color" value="blue" /><span class="color-swatch blue"></span><span class="sr-only">파랑</span></label>
              <label class="color-choice"><input type="radio" name="color" value="pink" /><span class="color-swatch pink"></span><span class="sr-only">분홍</span></label>
              <label class="color-choice"><input type="radio" name="color" value="sky" /><span class="color-swatch sky"></span><span class="sr-only">하늘</span></label>
              <label class="color-choice"><input type="radio" name="color" value="lime" /><span class="color-swatch lime"></span><span class="sr-only">연두</span></label>
              <label class="color-choice"><input type="radio" name="color" value="orange" /><span class="color-swatch orange"></span><span class="sr-only">주황</span></label>
              <label class="color-choice"><input type="radio" name="color" value="red" /><span class="color-swatch red"></span><span class="sr-only">빨강</span></label>
            </div>
          </fieldset>
          <button class="save-button" type="submit">일정 저장</button>
        </form>
      </section>

    </main>

    <div class="menu-backdrop" id="menuBackdrop" hidden></div>
    <aside class="side-menu" id="sideMenu" aria-labelledby="menuTitle" aria-modal="true" role="dialog">
      <div class="menu-heading">
        <div><p class="eyebrow">MY CALENDAR</p><h2 id="menuTitle">캘린더 목록</h2></div>
        <button class="close-composer" id="closeMenu" type="button" aria-label="캘린더 메뉴 닫기">×</button>
      </div>
      <nav class="calendar-menu-list" aria-label="캘린더 종류">
        <button class="menu-calendar-button is-active" id="personalCalendarButton" type="button" aria-pressed="true"><span class="menu-calendar-icon personal">✓</span><span>나의 일정<small>이 기기에만 저장돼요</small></span></button>
        <div class="shared-calendar-tabs" id="sharedCalendarTabs"></div>
        <button class="menu-calendar-button add-calendar-menu" id="sharedCalendarButton" type="button" aria-pressed="false"><span class="menu-calendar-icon">＋</span><span>공유 캘린더 추가</span></button>
      </nav>
      <div class="menu-settings">
        <button class="menu-setting-button" id="accountButton" type="button"><span>공유 캘린더 관리</span><span>›</span></button>
        <button class="menu-setting-button" id="themeButton" type="button" aria-label="다크 모드로 전환"><span>다크 모드</span><span class="theme-switch" aria-hidden="true"><i></i></span></button>
      </div>
    </aside>

    <div class="account-backdrop" id="accountBackdrop" hidden></div>
    <section class="account-sheet" id="accountSheet" aria-labelledby="accountTitle" aria-modal="true" role="dialog">
      <div class="composer-heading">
        <div>
          <p class="eyebrow">TOGETHER</p>
          <h2 id="accountTitle">캘린더 공유</h2>
        </div>
        <button class="close-composer" id="closeAccount" type="button" aria-label="공유 설정 닫기">×</button>
      </div>

      <div class="connection-notice" id="connectionNotice" hidden>
        <strong>온라인 연결이 필요해요</strong>
        <p>Supabase 프로젝트 주소와 공개 키를 설정하면 두 휴대폰이 연결됩니다.</p>
      </div>

      <div id="signedOutView">
        <p class="sheet-description">각자 같은 커플 공간에 참여하면 일정이 실시간으로 함께 보여요.</p>
        <form id="authForm">
          <label>이메일<input name="email" type="email" autocomplete="email" required placeholder="name@example.com" /></label>
          <label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="6자 이상" /></label>
          <p class="form-error" id="authError" role="alert" hidden></p>
          <button class="save-button" type="submit">로그인</button>
          <button class="secondary-button" id="signUpButton" type="button">처음이라면 회원가입</button>
        </form>
      </div>

      <div id="signedInView" hidden>
        <div class="account-summary">
          <div><span>로그인 계정</span><strong id="accountEmail"></strong></div>
          <button class="delete-button" id="signOutButton" type="button">로그아웃</button>
        </div>
        <div id="coupleConnectedView" hidden>
          <p class="sheet-description">참여 중인 공유 캘린더</p>
          <div class="couple-list" id="coupleList"></div>
        </div>
        <div id="coupleSetupView" class="couple-setup-view">
          <form id="createCoupleForm">
            <label>커플 캘린더 이름<input name="name" type="text" maxlength="30" required placeholder="예: 우리의 캘린더" /></label>
            <label>처음 만난 날<input name="firstMetOn" type="date" required /></label>
            <button class="save-button" type="submit">새 공유 캘린더 만들기</button>
          </form>
          <div class="or-divider"><span>또는</span></div>
          <form id="joinCoupleForm">
            <label>상대방의 초대 코드<input name="code" type="text" maxlength="8" required placeholder="예: LOVE1234" /></label>
            <button class="secondary-button" type="submit">초대 코드로 참여하기</button>
          </form>
          <p class="form-error" id="coupleError" role="alert" hidden></p>
        </div>
      </div>
    </section>
    <template id="eventTemplate">
      <article class="event-item">
        <span class="event-marker"></span>
        <div class="event-copy">
          <strong></strong>
          <span></span>
        </div>
        <div class="event-actions">
          <button type="button" class="edit-button" aria-label="일정 수정">수정</button>
          <button type="button" class="delete-button" aria-label="일정 삭제">삭제</button>
        </div>
      </article>
    </template>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=19"></script>
    <script src="shared-calendar.js?v=19"></script>
    <script src="app.js?v=19"></script>
  </body>
</html>
